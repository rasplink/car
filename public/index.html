<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control panel</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        font-family: Helvetica, Arial, sans-serif;
      }
      #guide {
        text-align: center;
        color: firebrick;
      }
      .btns {
        text-align: center;
        width: 150px;
        margin: 0 auto;
      }
      .btns section {
        overflow: hidden;
      }
      .btns button {
        width: 40px;
        height: 40px;
        float: left;
        font-size: 30px;
        margin: 5px;
        color: #333;
      }
      #stop {
        width: 100%;
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      #right {
        float: right;
      }
    </style>
  </head>
  <body>
    <h1 id="guide">idle</h1>
    <div class="btns">
      <section>
        <button type="button" id="forwardLeft">⇖</button>
        <button type="button" id="forward">↑</button>
        <button type="button" id="forwardRight">⇗</button>
      </section>
      <section>
        <button type="button" id="left">←</button>
        <button type="button" id="right">→</button>
      </section>
      <section>
        <button type="button" id="backwardLeft">⇙</button>
        <button type="button" id="backward">↓</button>
        <button type="button" id="backwardRight">⇘</button>
      </section>
      <section>
        <button type="button" id="stop">stop</button>
      </section>
    </div>

    <!-- <script src="https://unpkg.com/olum-helpers@latest/dist/olum-helpers.min.js"></script> -->
    <script src="olum-helpers.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
